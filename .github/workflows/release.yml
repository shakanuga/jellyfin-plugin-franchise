name: Release

# Neue Version veröffentlichen: <AssemblyVersion> im .csproj erhöhen und pushen (oder Action von Hand starten).
# Gibt es für die Version noch kein Release, wird es erstellt – Jellyfin bietet das Update dann im Katalog an.
# Änderungshinweis: Text in CHANGELOG.md unter der Überschrift "## <Version>".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Version lesen / schon veröffentlicht?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP '(?<=<AssemblyVersion>)[^<]+' Jellyfin.Plugin.FranchiseCollections/Jellyfin.Plugin.FranchiseCollections.csproj)
          TAG="v${VERSION%.0}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG gibt es schon – nichts zu tun."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Bauen (Jellyfin 12)
        if: env.SKIP != '1'
        run: |
          dotnet publish Jellyfin.Plugin.FranchiseCollections/Jellyfin.Plugin.FranchiseCollections.csproj \
            -c Release -o build -p:PluginTargetFramework=net10.0 -p:JellyfinVersion="12.*" \
            -p:AssemblyVersion=$VERSION -p:FileVersion=$VERSION
          mkdir pkg
          cp build/Jellyfin.Plugin.FranchiseCollections.dll pkg/
          sed -e "s/__VERSION__/${VERSION}/" -e "s/__ABI__/12.0.0.0/" meta.json > pkg/meta.json
          ZIP="FranchiseCollections_${VERSION}.zip"
          (cd pkg && zip -q "../$ZIP" *)
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "CHECKSUM=$(md5sum "$ZIP" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Katalog-Manifest erzeugen
        if: env.SKIP != '1'
        run: |
          python3 - <<'PY'
          import json, os, datetime, subprocess
          v = os.environ["VERSION"]
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["TAG"]
          log = ""
          if os.path.exists("CHANGELOG.md"):
              # Abschnitt "## <Version>" bis zur nächsten Überschrift
              lines, take = [], False
              for line in open("CHANGELOG.md", encoding="utf-8"):
                  if line.startswith("## "):
                      if take:
                          break
                      take = line[3:].strip() in (v, tag, tag.lstrip("v"))
                      continue
                  if take:
                      lines.append(line.rstrip())
              log = "\n".join(lines).strip()
          manifest = [{
              "guid": "4aa153a4-4b69-49df-b058-81da9a1685b2",
              "name": "Franchise Collections",
              "description": "Franchise-Sammlungen (MCU mit Phasen, Marvel, Star Trek, Akte X …) mit Filmen und Serien sowie automatisch sortierte Watch-Order-Playlists pro Benutzer.",
              "overview": "Große Sammlungen und Watch-Order-Playlists",
              "owner": repo.split("/")[0],
              "category": "General",
              "versions": [{
                  "version": v,
                  "changelog": log or f"Version {v}",
                  "targetAbi": "12.0.0.0",
                  "sourceUrl": f"https://github.com/{repo}/releases/download/{tag}/{os.environ['ZIP']}",
                  "checksum": os.environ["CHECKSUM"],
                  "timestamp": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
              }]
          }]
          json.dump(manifest, open("manifest.json", "w"), indent=2, ensure_ascii=False)
          PY
          cat manifest.json

      - name: GitHub-Release erstellen
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c "import json;print(json.load(open('manifest.json'))[0]['versions'][0]['changelog'])" > notes.md
          gh release create "$TAG" "$ZIP" manifest.json --target "$GITHUB_SHA" \
            --title "Franchise Collections $TAG" --notes-file notes.md
