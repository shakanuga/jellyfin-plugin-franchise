# Dependabot: sucht jeden Montag nach Updates und macht dafür Pull Requests.
# Kleine Updates (minor/patch) kommen gesammelt in einem PR, große (major) einzeln.
# Der Workflow "Updates prüfen & mergen" testet sie und mergt sie automatisch.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
